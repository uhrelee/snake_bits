<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat-Controlled Snake</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="gameContainer">
        <canvas id="gameBoard" width="1000" height="500"></canvas>

        <span class="overlay-text" id="scoreDisplay">Score: 0</span>
        <span class="overlay-text" id="highScoreDisplay">High Score: 0</span>
        <span class="overlay-text" id="lastTypedDisplay">Last Typed: —</span>
        <span class="overlay-text" id="liveChatDisplay">Chat Snake Live</span>
    
        <button id="resetBtn">Play Again!</button>

        <div id="chatContainer">
            <div id="chatMessages"></div>
            <input type="text" id="chatInput" placeholder="Send a message" autocomplete="off"/>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
